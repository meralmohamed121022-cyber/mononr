<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="arrowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="arrowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Clean Pure White Background with rounded corners and border -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#e2e8f0" stroke-width="6"/>

  <!-- Subtle Refill Orbit Background Track -->
  <circle cx="256" cy="230" r="165" fill="none" stroke="#f1f5f9" stroke-width="28"/>

  <!-- Refill Orbit Arc 1 (Top-Right to Bottom-Right) with Arrowhead -->
  <path d="M 256 65 A 165 165 0 0 1 421 230 A 165 165 0 0 1 378 335" 
        fill="none" stroke="url(#arrowGrad1)" stroke-width="26" stroke-linecap="round"/>
  <!-- Arrow Head 1 -->
  <path d="M 390 350 L 360 342 L 382 312 Z" fill="#0284c7"/>

  <!-- Refill Orbit Arc 2 (Bottom-Left to Top-Left) with Arrowhead -->
  <path d="M 256 395 A 165 165 0 0 1 91 230 A 165 165 0 0 1 134 125" 
        fill="none" stroke="url(#arrowGrad2)" stroke-width="26" stroke-linecap="round"/>
  <!-- Arrow Head 2 -->
  <path d="M 122 110 L 152 118 L 130 148 Z" fill="#059669"/>

  <!-- Center Group: Medical Pill / Capsule angled at 45deg -->
  <g transform="translate(256, 230) rotate(-45)" filter="url(#pillGlow)">
    <!-- Pill Clip Path -->
    <clipPath id="pillClip">
      <rect x="-60" y="-135" width="120" height="270" rx="60"/>
    </clipPath>
    
    <!-- Base Capsule Shadow -->
    <rect x="-60" y="-135" width="120" height="270" rx="60" fill="#ffffff" filter="url(#softShadow)"/>

    <g clip-path="url(#pillClip)">
      <!-- Top Half: Medical Blue -->
      <rect x="-60" y="-135" width="120" height="135" fill="url(#blueGrad)"/>
      <!-- Top Highlight -->
      <ellipse cx="-15" cy="-70" rx="14" ry="40" fill="#ffffff" opacity="0.35" transform="rotate(-15, -15, -70)"/>

      <!-- Bottom Half: Emerald Green -->
      <rect x="-60" y="0" width="120" height="135" fill="url(#greenGrad)"/>
      <!-- Bottom Highlight -->
      <ellipse cx="-15" cy="65" rx="14" ry="40" fill="#ffffff" opacity="0.25" transform="rotate(-15, -15, 65)"/>

      <!-- Dividing Seam -->
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#ffffff" stroke-width="6"/>
    </g>

    <!-- White Medical Cross in the center of the capsule -->
    <circle cx="0" cy="0" r="32" fill="#ffffff" filter="url(#softShadow)"/>
    <path d="M 0 -18 L 0 18 M -18 0 L 18 0" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Typography at bottom: MWRS Refill Badge -->
  <g transform="translate(256, 436)">
    <!-- Pill badge for text -->
    <rect x="-120" y="-24" width="240" height="48" rx="24" fill="#0f172a"/>
    <text x="0" y="9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="24" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="4">
      MWRS
    </text>
  </g>
</svg>
